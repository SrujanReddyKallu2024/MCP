[project]
name = "ops-mcp-server"
version = "1.0.0"
description = "MCP Server for AWS MWAA (Airflow), EMR Serverless, and Confluence"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ops-mcp = "mcp_server.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
